<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade room · TradeSafe</title>
  <meta name="theme-color" content="#f4f2ee">
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/css/app.css?v=20261022d">
</head>
<body class="app" data-page="room">
  <a class="skip" href="#content">Skip to content</a>
  <header id="site-header"></header>
  <main id="content">
    <div class="panel" id="room-root">
      <p class="loading" id="boot">Loading room…</p>
      <div id="room" class="hidden room-simple">
        <div class="room-head">
          <div>
            <div class="room-kicker">
              <span class="status-dot" id="live-dot"><i></i><span>Connecting</span></span>
              <span class="tag demo hidden" id="demo-tag">Demo</span>
              <span class="tag" id="status-tag">—</span>
            </div>
            <h1 id="title">—</h1>
            <p class="room-amount" id="amount-line"></p>
            <p class="turn-line" id="turn-line"></p>
            <p class="hint" id="ref">Ref —</p>
          </div>
          <button type="button" class="ghost" id="share">Copy invite</button>
        </div>

        <div class="participants people-sm" id="participants"></div>

        <details class="mini-menu hidden" id="confidence-card">
          <summary>Trade confidence</summary>
          <div id="confidence-body"></div>
        </details>

        <div class="actions" id="actions"></div>

        <section class="chat-card">
          <h2>Messages</h2>
          <div class="chat" id="chat"></div>
          <form class="chat-form" id="chat-form">
            <input class="field" id="chat-input" maxlength="4000" placeholder="Message" required>
            <button class="btn" type="submit">Send</button>
          </form>
        </section>

        <details class="mini-menu report-menu">
          <summary>Report a concern</summary>
          <form id="report-form" class="form-stack">
            <div>
              <label class="field-label" for="report-category">Category</label>
              <select class="field" id="report-category" required>
                <option value="scam">Suspected scam</option>
                <option value="impersonation">Impersonation</option>
                <option value="suspicious">Suspicious behavior</option>
                <option value="unauthorized_access">Unauthorized trade access</option>
                <option value="payment">Payment-related concern</option>
                <option value="abuse">Threats or abuse</option>
                <option value="compromised_invite">Compromised invitation</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="report-summary">Summary</label>
              <input class="field" id="report-summary" maxlength="500" required placeholder="What happened">
            </div>
            <div>
              <label class="field-label" for="report-details">Details</label>
              <textarea class="field" id="report-details" maxlength="5000" placeholder="Optional"></textarea>
            </div>
            <p id="report-msg" class="hint hidden" role="status"></p>
            <button type="submit" class="ghost">Submit report</button>
          </form>
        </details>
      </div>
      <div id="room-error" class="empty hidden">
        <h3>Could not load this room</h3>
        <p id="room-error-text">You may not have access, or the link is invalid.</p>
        <p style="margin-top:16px"><a class="btn" href="/dashboard.html">Back to my trades</a></p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module">
    import { mountChrome } from "/js/chrome.js";
    mountChrome();
  </script>
  <script type="module" src="/js/room.js?v=20261022d"></script>
</body>
</html>
