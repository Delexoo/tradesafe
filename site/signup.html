<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · TradeSafe</title>
  <meta name="theme-color" content="#f4f2ee">
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="signup">
  <a class="skip" href="#content">Skip to content</a>
  <header id="site-header"></header>
  <main id="content">
    <div id="page-auth"></div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module">
    import { mountChrome } from "/js/chrome.js";
    import { authPanelHtml, bindEmailAuth } from "/js/email-auth.js";
    mountChrome();
    const root = document.getElementById("page-auth");
    root.innerHTML = authPanelHtml("signup");
    bindEmailAuth(root, { initialMode: "signup" });
  </script>
</body>
</html>
