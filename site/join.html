<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join trade · TradeSafe</title>
  <meta name="theme-color" content="#f4f2ee">
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="join">
  <a class="skip" href="#content">Skip to content</a>
  <header id="site-header"></header>
  <main id="content">
    <div class="panel narrow">
      <h1>Join a trade</h1>
      <p class="note">No account required. Review the summary, choose a display name, and accept the policies.</p>
      <p id="status" class="loading">Loading invitation…</p>
      <div id="summary" class="inset hidden" style="margin:16px 0"></div>
      <form id="join-form" class="form-stack hidden">
        <div>
          <label class="field-label" for="display-name">Your display name</label>
          <input class="field" id="display-name" maxlength="80" required placeholder="How you’ll appear in this trade">
        </div>
        <div id="policy-box"></div>
        <p id="error" class="field-error hidden" role="alert"></p>
        <button type="submit" class="btn" id="join-btn" disabled>Join room</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module">
    import { mountChrome } from "/js/chrome.js";
    mountChrome();
  </script>
  <script type="module" src="/js/join.js"></script>
</body>
</html>
