<!DOCTYPE html>
<html lang="en" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join trade · TradeSafe</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="join">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topnav" id="app-nav"></header>
  <main id="content" class="shell">
    <div class="panel narrow">
      <h1>Join a trade</h1>
      <p class="note">No account required. Review the public summary, choose a display name, and accept the platform policies to enter the room.</p>
      <p id="status" class="loading">Loading invitation…</p>
      <div id="summary" class="inset hidden" style="margin:16px 0"></div>
      <form id="join-form" class="form-stack hidden">
        <div>
          <label class="field-label" for="display-name">Your display name</label>
          <input class="field" id="display-name" maxlength="80" required placeholder="How you’ll appear in this trade">
        </div>
        <div id="policy-box"></div>
        <p id="error" class="field-error hidden" role="alert"></p>
        <button type="submit" class="btn" id="join-btn" disabled>Join room</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/join.js"></script>
</body>
</html>
