<!DOCTYPE html>
<html lang="en" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join trade · TradeSafe</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="join">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topnav" id="app-nav"></header>
  <main id="content" class="shell">
    <div class="panel narrow">
      <h1>Join a trade</h1>
      <p class="note">You were invited with a private link. Sign in if needed, then join the room.</p>
      <p id="status" class="loading">Checking invitation…</p>
      <p id="error" class="field-error hidden" role="alert"></p>
      <button type="button" class="btn hidden" id="join-btn">Join room</button>
    </div>
  </main>
  <script type="module" src="/js/join.js"></script>
</body>
</html>
