<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in · TradeSafe</title>
  <meta name="theme-color" content="#f4f2ee">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="login">
  <main id="content">
    <div class="panel create-card">
      <h1 id="verified-title">Signing you in</h1>
      <p class="note" id="verified-status">One moment…</p>
    </div>
  </main>
  <script type="module">
    import { finishEmailHandoff } from "/js/email-handoff.js";
    import { safeNextPath } from "/js/auth-email.js";

    const STORAGE_KEY = "ts-email-handoff";
    const params = new URLSearchParams(location.search);
    const loginId = params.get("login");
    const title = document.getElementById("verified-title");
    const status = document.getElementById("verified-status");
    const next = safeNextPath(location.search);

    let askedHere = false;
    try {
      const stored = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null");
      askedHere = !!(stored && loginId && stored.id === loginId);
    } catch {
      askedHere = false;
    }

    const result = await finishEmailHandoff(loginId);
    if (result.ok && askedHere) {
      location.replace(next);
    } else if (result.ok) {
      title.textContent = "Check your other device";
      status.textContent =
        "That device is signing in now. You can close this page.";
    } else if (result.signedInHere) {
      title.textContent = "Almost there";
      status.textContent =
        "This browser is signed in, but the device that asked for the email could not be updated. Request a new link from that device.";
    } else {
      title.textContent = "Link did not work";
      status.textContent =
        "Go back to the device that asked for the email and request a new one.";
    }
  </script>
</body>
</html>
