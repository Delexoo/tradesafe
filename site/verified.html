<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in · TradeSafe</title>
  <meta name="theme-color" content="#f4f2ee">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="login">
  <main id="content">
    <div class="panel create-card">
      <h1 id="verified-title">Signing you in</h1>
      <p class="note" id="verified-status">One moment…</p>
    </div>
  </main>
  <script type="module">
    import {
      finishEmailHandoff,
      readEmailHandoffStored,
    } from "/js/email-handoff.js";
    import { safeNextPath } from "/js/auth-email.js";

    const STORAGE_KEY = "ts-email-handoff";
    const params = new URLSearchParams(location.search);
    const loginId = params.get("login");
    const title = document.getElementById("verified-title");
    const status = document.getElementById("verified-status");
    const next = safeNextPath(location.search);

    const stored = readEmailHandoffStored();
    const handoffId = loginId || stored?.id || null;
    // Same browser that asked for the link — continue here even if complete fails.
    const sameBrowser = !!(
      stored &&
      (!loginId || stored.id === loginId || stored.nextPath === next)
    );

    try {
      const result = await finishEmailHandoff(handoffId);
      const session = result.session;

      if (session?.user && sameBrowser) {
        try {
          sessionStorage.removeItem(STORAGE_KEY);
        } catch {
          /* ignore */
        }
        location.replace(stored?.nextPath && stored.nextPath.startsWith("/") ? stored.nextPath : next);
        return;
      }

      if (result.ok && session?.user) {
        title.textContent = "Check your other device";
        status.textContent =
          "That device is signing in now. You can close this page.";
        return;
      }

      if (session?.user) {
        title.textContent = "You are signed in here";
        status.innerHTML =
          `Continue on this device: <a href="${next}">open TradeSafe</a>. The other device may still be waiting on an older link.`;
        return;
      }

      title.textContent = "Link did not work";
      status.textContent =
        "Go back to the device that asked for the email and request a new one. Open the newest email link.";
    } catch {
      title.textContent = "Link did not work";
      status.textContent =
        "Go back to the device that asked for the email and request a new one.";
    }
  </script>
</body>
</html>
