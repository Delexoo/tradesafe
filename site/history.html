<!DOCTYPE html>
<html lang="en" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · TradeSafe</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="history">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topnav" id="app-nav"></header>
  <main id="content" class="shell">
    <div class="panel">
      <h1>History</h1>
      <p class="note">Completed, cancelled, refunded, and disputed trades.</p>
      <div id="status" class="loading">Loading…</div>
      <div id="list" class="rows hidden"></div>
      <div id="empty" class="empty hidden">
        <h3>No history yet</h3>
        <p>Finished trades will appear here.</p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/history.js"></script>
</body>
</html>
